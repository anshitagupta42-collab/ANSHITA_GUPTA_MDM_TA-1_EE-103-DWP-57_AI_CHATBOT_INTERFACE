<!DOCTYPE html>
<html>
<head>
<title>Intelligent Chatbot</title>
<link rel="stylesheet" href="newfile.css">
</head>
<body>

<div class="chat-container">
    <div class="header">Intelligent Chatbot</div>

    <div class="chat-box">
        <div class="bot">Hello 👋 I am your AI assistant.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message">
        <button>Send</button>
    </div>
</div>

<script>
const inputEl = document.getElementById("userInput");
const chatBox = document.querySelector(".chat-box");

function appendMessage(text, cls) {
    const msg = document.createElement("div");
    msg.className = cls;
    msg.innerText = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    appendMessage(text, "user");
    appendMessage("This is a sample response from chatbot.", "bot");
    inputEl.value = "";
    inputEl.focus();
}

document.querySelector(".input-area button").addEventListener("click", sendMessage);
inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
    }
});
</script>

</body>
</html>
